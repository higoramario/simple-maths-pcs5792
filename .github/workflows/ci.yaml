name: Simple-maths CI
run-name: ${{github.actor}} fez push no projeto
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configurando o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Instalando as dependencias
        run: |
          python -m pip install --upgrade pip
          pip install coverage pylint numpy
      - name: Rodando os testes
        run: python -m unittest -v
      - name: Cobertura dos testes
        run: | 
          coverage run -m unittest discover
          coverage report
          coverage html
      - name: Armazenar relatorio de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: htmlcov
      - name: Executando o pylint
        run: pylint --recursive=y

